name: Prepare root tests
description: Install tooling, build the app and prepare Chromium for root tests
inputs:
  shard:
    description: Root shard index and total
    required: true
  suite:
    description: Root test partition
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: |
          package-lock.json
          desktop/package-lock.json
          collab-server/package-lock.json

    - name: Install tooling
      shell: bash
      run: npm ci && npm ci --prefix desktop && npm ci --prefix collab-server

    - name: Build index.html and stamp sw.js
      shell: bash
      run: node build.mjs

    - name: sw.js is committed with the current VERSION stamp
      shell: bash
      run: git diff --exit-code -- sw.js

    - name: Check whether this shard prints PDFs
      id: chromium
      shell: bash
      env:
        ROOT_SHARD: ${{ inputs.shard }}
        ROOT_SUITE: ${{ inputs.suite }}
      run: |
        args=(--shard "$ROOT_SHARD")
        if [ -n "$ROOT_SUITE" ]; then args+=("--suite=$ROOT_SUITE"); fi
        selection=$(node tools/run-tests.mjs all --list "${args[@]}")
        case "$(printf '%s\n' "$selection" | tail -n 1)" in
          'requires Chromium: true') echo 'required=true' >> "$GITHUB_OUTPUT" ;;
          'requires Chromium: false') echo 'required=false' >> "$GITHUB_OUTPUT" ;;
          *) exit 1 ;;
        esac

    - name: Select persistent Chromium cache
      if: steps.chromium.outputs.required == 'true'
      shell: bash
      run: |
        test -n "$RUNNER_TOOL_CACHE"
        echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TOOL_CACHE/splitpage-playwright/$PLAYWRIGHT_VERSION" >> "$GITHUB_ENV"

    - name: Install Chromium
      if: steps.chromium.outputs.required == 'true'
      shell: bash
      run: |
        npx --yes playwright@${PLAYWRIGHT_VERSION} install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium
        exe=$(find "$PLAYWRIGHT_BROWSERS_PATH" -maxdepth 3 -type f -path '*/chromium-*/*' -name chrome -print -quit)
        if [ -z "$exe" ]; then
          echo "::error::no Chromium under $PLAYWRIGHT_BROWSERS_PATH"
          exit 1
        fi
        echo "SPLITPAGE_CHROME=$exe" >> "$GITHUB_ENV"
