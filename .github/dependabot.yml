# Dependency updates arrive as pull requests, so they run through the same CI
# as any other change. Weekly and grouped, so a week's worth is one PR per
# area rather than a stream.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        patterns: ['*']

  # The Electron shell and its installer builder. Major Electron releases
  # change Chromium and the security defaults, so they are read, not merged
  # on green.
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    groups:
      desktop:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # The server image's base (node:*-alpine or similar).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
