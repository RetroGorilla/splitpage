name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'hotfix/**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PLAYWRIGHT_VERSION: '1.63.0'

jobs:
  changes:
    runs-on: ${{ contains(github.event.pull_request.labels.*.name, 'ci-github') && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
      tree: ${{ steps.tested.outputs.tree }}
      tested: ${{ steps.tested.outputs.tested }}
      app: ${{ steps.classify.outputs.app }}
      desktop: ${{ steps.classify.outputs.desktop }}
      collab: ${{ steps.classify.outputs.collab }}
      root_tests: ${{ steps.classify.outputs.root_tests }}
      root_due: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (steps.classify.outputs.root_tests == 'true' && steps.tested.outputs.tested != 'true') }}
      old_adapter: ${{ steps.classify.outputs.old_adapter }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install the classifier's dependencies
        run: npm ci --ignore-scripts

      - name: Classify the change
        id: classify
        run: node tools/ci-changes.mjs "$BASE" "$HEAD"
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Find a passed run of this exact tree
        id: tested
        run: node tools/ci-tested-tree.mjs ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '--lookup' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

  npm-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
            prototypes/collab/package-lock.json

      - name: Download every locked package into the npm cache
        run: npm ci --ignore-scripts && npm ci --ignore-scripts --prefix desktop && npm ci --ignore-scripts --prefix prototypes/collab

  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ${{ contains(github.event.pull_request.labels.*.name, 'ci-github') && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    env:
      SPLITPAGE_CHROME_ARGS: --no-sandbox --disable-dev-shm-usage
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
            prototypes/collab/package-lock.json

      - name: Install tooling
        run: npm ci && npm ci --prefix desktop && npm ci --prefix prototypes/collab

      - name: Prototype shard command matches its test script
        if: needs.changes.outputs.collab == 'true'
        run: node tools/test-ci-collab-shards.mjs

      - name: Root test partitions cover every test
        run: node tools/test-ci-old-adapter-shards.mjs

      - name: Desktop browser scripts are generated from their checked sources
        if: needs.changes.outputs.root_tests == 'true'
        run: node tools/build-preload.mjs && node tools/check-preload.mjs

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Layers and dependencies
        run: npm run check:deps

      - name: No new comments
        run: npm run check:comments

      - name: Build index.html and stamp sw.js
        if: needs.changes.outputs.app == 'true'
        run: node build.mjs --test

      - name: sw.js is committed with the current VERSION stamp
        if: needs.changes.outputs.app == 'true'
        run: |
          git diff --exit-code -- sw.js || {
            echo "::error file=sw.js::sw.js's cache name does not match VERSION — run \`node build.mjs\` and commit sw.js"
            exit 1
          }

      - name: Select persistent Chromium cache
        if: needs.changes.outputs.app == 'true'
        run: |
          test -n "$RUNNER_TOOL_CACHE"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TOOL_CACHE/splitpage-playwright/$PLAYWRIGHT_VERSION" >> "$GITHUB_ENV"

      - name: Install Chromium
        if: needs.changes.outputs.app == 'true'
        run: |
          npx --yes playwright@${PLAYWRIGHT_VERSION} install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium
          exe=$(find "$PLAYWRIGHT_BROWSERS_PATH" -maxdepth 3 -type f -path '*/chromium-*/*' -name chrome -print -quit)
          if [ -z "$exe" ]; then
            echo "::error::no Chromium under $PLAYWRIGHT_BROWSERS_PATH"
            ls -R "$PLAYWRIGHT_BROWSERS_PATH" | head -60
            exit 1
          fi
          echo "SPLITPAGE_CHROME=$exe" >> "$GITHUB_ENV"

      - name: Pick this runner's port block
        if: needs.changes.outputs.app == 'true'
        run: |
          n=${RUNNER_NAME##*-}
          case "$n" in ''|*[!0-9]*|?????*) n=1 ;; esac
          echo "PORT_BASE=$(( (10#$n + 9) % 10 * 100 ))" >> "$GITHUB_ENV"

      - name: Browser suites 01 (core) and 52 (content security policy)
        if: needs.changes.outputs.app == 'true'
        run: node tools/run-suites.mjs "$RUNNER_TEMP/suites" '^(01-core|52-csp)\.txt$' --lanes 2 --port-base "$PORT_BASE"

      - name: Browser suites for save, typing, undo and export
        if: needs.changes.outputs.app == 'true'
        run: node tools/run-suites.mjs "$RUNNER_TEMP/suites-flows" '^(19-save-conflict|28-autosave|185-autosave-every-edit|261-import-save-back-late-edit|270-save-open-every-surface|283-save-status-by-destination|285-save-buttons-one-state|06-writer|81-draft-edit|282-editor-operations|289-script-cell-ime|73-undo|84-undo-caret|267-writer-undo|03-exports|41-export-polish|259-xlsx-export|284-exports-from-a-fixture|98-export-dialog|595-writer-flow-mode-position|596-writer-flow-typing-work)\.txt$' --lanes 2 --port-base "$PORT_BASE"

      - name: Upload the suite logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: suite-logs
          path: |
            ${{ runner.temp }}/suites
            ${{ runner.temp }}/suites-flows
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the built app
        if: needs.changes.outputs.app == 'true' && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: splitpage-app
          path: |
            index.html
            sw.js
            manifest.webmanifest
            icon.svg
            icon-maskable.svg
            VERSION
            server/
          if-no-files-found: error
          retention-days: 30

  tests:
    name: Tests (${{ matrix.shard }}/5)
    needs: changes
    if: needs.changes.outputs.root_due == 'true'
    runs-on: ${{ contains(github.event.pull_request.labels.*.name, 'ci-github') && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    env:
      SPLITPAGE_CHROME_ARGS: --no-sandbox --disable-dev-shm-usage
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/root-test-setup
        with:
          shard: ${{ matrix.shard }}/5
          suite: always

      - name: Unit, desktop and tool test shard
        run: npm run test:all -- --shard "${{ matrix.shard }}/5" --suite=always

  old-adapter-tests:
    name: Old adapter tests (${{ matrix.shard }}/6)
    needs: changes
    if: needs.changes.outputs.old_adapter == 'true'
    runs-on: ${{ contains(github.event.pull_request.labels.*.name, 'ci-github') && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    env:
      SPLITPAGE_CHROME_ARGS: --no-sandbox --disable-dev-shm-usage
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/root-test-setup
        with:
          shard: ${{ matrix.shard }}/6
          suite: old-adapter

      - name: Old adapter test shard
        run: npm run test:all -- --shard "${{ matrix.shard }}/6" --suite=old-adapter

  collab-tests:
    name: Collaboration prototype tests (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.collab == 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ${{ contains(github.event.pull_request.labels.*.name, 'ci-github') && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
            prototypes/collab/package-lock.json

      - name: Install the prototype's packages
        run: npm ci
        working-directory: prototypes/collab

      - name: Collaboration prototype test shard
        run: node --test --test-shard="${{ matrix.shard }}/4" "test/**/*.test.ts" "test/**/*.test.mjs"
        working-directory: prototypes/collab

  gate:
    needs: [changes, checks, tests, old-adapter-tests, collab-tests, desktop-smoke]
    if: always()
    runs-on: ${{ contains(github.event.pull_request.labels.*.name, 'ci-github') && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 2
    permissions:
      actions: read
    steps:
      - name: Every required job passed, or the change was prose only
        run: |
          echo "changes=$CHANGES code=$CODE root_due=$ROOT_DUE old_adapter=$OLD_ADAPTER collab=$COLLAB tested=$TESTED desktop=$DESKTOP checks=$CHECKS tests=$TESTS old_adapter_tests=$OLD_ADAPTER_TESTS collab_tests=$COLLAB_TESTS smoke=$SMOKE"
          [ "$CHANGES" = success ] || exit 1
          want_tests=skipped
          if [ "$ROOT_DUE" = true ]; then want_tests=success; fi
          [ "$TESTS" = "$want_tests" ] || exit 1
          want_old=skipped
          if [ "$OLD_ADAPTER" = true ]; then want_old=success; fi
          [ "$OLD_ADAPTER_TESTS" = "$want_old" ] || exit 1
          if [ "$CODE" = true ] && [ "$TESTED" != true ]; then
            want_collab=skipped
            if [ "$COLLAB" = true ]; then want_collab=success; fi
            want_smoke=skipped
            if [ "$DESKTOP" = true ]; then want_smoke=success; fi
            [ "$CHECKS" = success ] && [ "$COLLAB_TESTS" = "$want_collab" ] && [ "$SMOKE" = "$want_smoke" ]
          else
            [ "$CHECKS" = skipped ] && [ "$COLLAB_TESTS" = skipped ] && [ "$SMOKE" = skipped ]
          fi
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          ROOT_DUE: ${{ needs.changes.outputs.root_due }}
          OLD_ADAPTER: ${{ needs.changes.outputs.old_adapter }}
          COLLAB: ${{ needs.changes.outputs.collab }}
          TESTED: ${{ needs.changes.outputs.tested }}
          DESKTOP: ${{ needs.changes.outputs.desktop }}
          CHECKS: ${{ needs.checks.result }}
          TESTS: ${{ needs.tests.result }}
          OLD_ADAPTER_TESTS: ${{ needs.old-adapter-tests.result }}
          COLLAB_TESTS: ${{ needs.collab-tests.result }}
          SMOKE: ${{ needs.desktop-smoke.result }}

      - name: Every required matrix shard passed
        if: needs.changes.outputs.root_due == 'true' || needs.changes.outputs.old_adapter == 'true' || (needs.changes.outputs.code == 'true' && needs.changes.outputs.tested != 'true' && needs.changes.outputs.collab == 'true')
        run: |
          jobs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=all&per_page=100" --jq '.jobs[] | [.name, .run_attempt, .conclusion] | @tsv')
          verify_shards() {
            local label=$1 count=$2 shard name result
            for ((shard = 1; shard <= count; shard++)); do
              name="$label ($shard/$count)"
              result=$(awk -F '\t' -v name="$name" '
                $1 == name && $2 ~ /^[1-9][0-9]*$/ {
                  attempt = $2 + 0
                  if (attempt > latest) { latest = attempt; count = 0 }
                  if (attempt == latest) { count++; conclusion = $3 }
                }
                END { if (count == 1) print conclusion; else if (count > 1) print "duplicate" }
              ' <<< "$jobs")
              if [ "$result" != success ]; then
                echo "::error::$name must have exactly one successful job (found: ${result:-missing})"
                return 1
              fi
            done
          }
          if [ "$ROOT_TESTS" = true ]; then verify_shards "Tests" "$ROOT_SHARDS"; fi
          if [ "$OLD_ADAPTER" = true ]; then verify_shards "Old adapter tests" "$OLD_SHARDS"; fi
          if [ "$COLLAB" = true ]; then verify_shards "Collaboration prototype tests" "$COLLAB_SHARDS"; fi
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT_TESTS: ${{ needs.changes.outputs.root_due }}
          OLD_ADAPTER: ${{ needs.changes.outputs.old_adapter }}
          COLLAB: ${{ needs.changes.outputs.code == 'true' && needs.changes.outputs.tested != 'true' && needs.changes.outputs.collab == 'true' }}
          ROOT_SHARDS: '5'
          OLD_SHARDS: '6'
          COLLAB_SHARDS: '4'

      - name: Write the passed tree's marker
        if: needs.checks.result == 'success' && needs.tests.result == 'success' && (needs.old-adapter-tests.result == 'success' || needs.old-adapter-tests.result == 'skipped') && (needs.collab-tests.result == 'success' || needs.collab-tests.result == 'skipped') && (needs.desktop-smoke.result == 'success' || needs.desktop-smoke.result == 'skipped') && needs.changes.outputs.tree != ''
        run: echo "$TREE" > "$RUNNER_TEMP/passed-tree.txt"
        env:
          TREE: ${{ needs.changes.outputs.tree }}

      - name: Upload the passed tree's marker
        if: needs.checks.result == 'success' && needs.tests.result == 'success' && (needs.old-adapter-tests.result == 'success' || needs.old-adapter-tests.result == 'skipped') && (needs.collab-tests.result == 'success' || needs.collab-tests.result == 'skipped') && (needs.desktop-smoke.result == 'success' || needs.desktop-smoke.result == 'skipped') && needs.changes.outputs.tree != ''
        uses: actions/upload-artifact@v7
        with:
          name: ci-passed-tree-${{ needs.changes.outputs.tree }}
          path: ${{ runner.temp }}/passed-tree.txt
          if-no-files-found: error
          retention-days: 30

  desktop-smoke:
    needs: changes
    if: needs.changes.outputs.desktop == 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install build dependencies
        run: npm ci

      - name: Build index.html and stamp sw.js
        run: node build.mjs --test

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop

      - name: Fetch the dev Electron binary
        run: npm run fetch-electron
        working-directory: desktop

      - name: Xvfb and Chromium's shared libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
          npx --yes playwright@${PLAYWRIGHT_VERSION} install-deps chromium

      - name: Desktop smoke (dev target)
        working-directory: desktop
        run: |
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp \
            2> >(grep --line-buffered -vE 'Could not resolve keysym|XKEYBOARD keymap compiler|Errors from xkbcomp are not fatal' >&2) &
          for _ in $(seq 1 30); do [ -e /tmp/.X11-unix/X99 ] && break; sleep 1; done
          [ -e /tmp/.X11-unix/X99 ] || { echo "::error::Xvfb never came up"; exit 1; }
          DISPLAY=:99 node test/smoke.mjs --only-target dev
