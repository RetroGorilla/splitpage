name: CI

on:
  pull_request:
    branches: [main, 4.1-development]
  push:
    branches: [main, 4.1-development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PLAYWRIGHT_VERSION: '1.63.0'

jobs:
  changes:
    runs-on: ${{ contains(github.event.pull_request.labels.*.name, 'ci-github') && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
      tree: ${{ steps.tested.outputs.tree }}
      tested: ${{ steps.tested.outputs.tested }}
      app: ${{ steps.classify.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Classify the change
        id: classify
        run: node tools/ci-changes.mjs "$BASE" "$HEAD"
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Find a passed run of this exact tree
        id: tested
        run: node tools/ci-tested-tree.mjs ${{ github.event_name == 'push' && github.ref == 'refs/heads/4.1-development' && '--lookup' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ${{ contains(github.event.pull_request.labels.*.name, 'ci-github') && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    env:
      SPLITPAGE_CHROME_ARGS: --no-sandbox --disable-dev-shm-usage
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install tooling
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Layers and dependencies
        run: npm run check:deps

      - name: No new comments
        run: npm run check:comments

      - name: Build index.html and stamp sw.js
        if: needs.changes.outputs.app == 'true'
        run: node build.mjs

      - name: sw.js is committed with the current VERSION stamp
        if: needs.changes.outputs.app == 'true'
        run: |
          git diff --exit-code -- sw.js || {
            echo "::error file=sw.js::sw.js's cache name does not match VERSION — run \`node build.mjs\` and commit sw.js"
            exit 1
          }

      - name: Select persistent Chromium cache
        if: needs.changes.outputs.app == 'true'
        run: |
          test -n "$RUNNER_TOOL_CACHE"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TOOL_CACHE/splitpage-playwright/$PLAYWRIGHT_VERSION" >> "$GITHUB_ENV"

      - name: Install Chromium
        if: needs.changes.outputs.app == 'true'
        run: |
          npx --yes playwright@${PLAYWRIGHT_VERSION} install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium
          exe=$(find "$PLAYWRIGHT_BROWSERS_PATH" -maxdepth 3 -type f -path '*/chromium-*/*' -name chrome -print -quit)
          if [ -z "$exe" ]; then
            echo "::error::no Chromium under $PLAYWRIGHT_BROWSERS_PATH"
            ls -R "$PLAYWRIGHT_BROWSERS_PATH" | head -60
            exit 1
          fi
          echo "SPLITPAGE_CHROME=$exe" >> "$GITHUB_ENV"

      - name: Pick this runner's port block
        if: needs.changes.outputs.app == 'true'
        run: |
          n=${RUNNER_NAME##*-}
          case "$n" in ''|*[!0-9]*|?????*) n=1 ;; esac
          echo "PORT_BASE=$(( (10#$n + 9) % 10 * 100 ))" >> "$GITHUB_ENV"

      - name: Browser suites 01 (core) and 52 (content security policy)
        if: needs.changes.outputs.app == 'true'
        run: node tools/run-suites.mjs "$RUNNER_TEMP/suites" '^(01-core|52-csp)\.txt$' --lanes 2 --port-base "$PORT_BASE"

      - name: Upload the suite logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: suite-logs
          path: ${{ runner.temp }}/suites
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the built app
        if: needs.changes.outputs.app == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: splitpage-app
          path: |
            index.html
            sw.js
            manifest.webmanifest
            icon.svg
            icon-maskable.svg
            VERSION
            server/
          if-no-files-found: error
          retention-days: 30

  tests:
    name: Tests (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ${{ contains(github.event.pull_request.labels.*.name, 'ci-github') && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install tooling
        run: npm ci

      - name: Build index.html and stamp sw.js
        run: node build.mjs

      - name: sw.js is committed with the current VERSION stamp
        run: git diff --exit-code -- sw.js

      - name: Unit, desktop and tool test shard
        run: npm run test:all -- --shard "${{ matrix.shard }}/2"

  gate:
    needs: [changes, checks, tests]
    if: always()
    runs-on: ${{ contains(github.event.pull_request.labels.*.name, 'ci-github') && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 2
    steps:
      - name: Every required job passed, or the change was prose only
        run: |
          echo "changes=$CHANGES code=$CODE tested=$TESTED checks=$CHECKS tests=$TESTS"
          [ "$CHANGES" = success ] || exit 1
          if [ "$CODE" = true ] && [ "$TESTED" != true ]; then
            [ "$CHECKS" = success ] && [ "$TESTS" = success ]
          else
            [ "$CHECKS" = skipped ] && [ "$TESTS" = skipped ]
          fi
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          TESTED: ${{ needs.changes.outputs.tested }}
          CHECKS: ${{ needs.checks.result }}
          TESTS: ${{ needs.tests.result }}

      - name: Write the passed tree's marker
        if: needs.checks.result == 'success' && needs.tests.result == 'success' && needs.changes.outputs.tree != ''
        run: echo "$TREE" > "$RUNNER_TEMP/passed-tree.txt"
        env:
          TREE: ${{ needs.changes.outputs.tree }}

      - name: Upload the passed tree's marker
        if: needs.checks.result == 'success' && needs.tests.result == 'success' && needs.changes.outputs.tree != ''
        uses: actions/upload-artifact@v7
        with:
          name: ci-passed-tree-${{ needs.changes.outputs.tree }}
          path: ${{ runner.temp }}/passed-tree.txt
          if-no-files-found: error
          retention-days: 30

  desktop-smoke:
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install build dependencies
        run: npm ci

      - name: Build index.html and stamp sw.js
        run: node build.mjs

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop

      - name: Fetch the dev Electron binary
        run: npm run fetch-electron
        working-directory: desktop

      - name: Xvfb and Chromium's shared libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
          npx --yes playwright@${PLAYWRIGHT_VERSION} install-deps chromium

      - name: Desktop smoke (dev target)
        working-directory: desktop
        run: |
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp \
            2> >(grep --line-buffered -vE 'Could not resolve keysym|XKEYBOARD keymap compiler|Errors from xkbcomp are not fatal' >&2) &
          for _ in $(seq 1 30); do [ -e /tmp/.X11-unix/X99 ] && break; sleep 1; done
          [ -e /tmp/.X11-unix/X99 ] || { echo "::error::Xvfb never came up"; exit 1; }
          DISPLAY=:99 node test/smoke.mjs --only-target dev
