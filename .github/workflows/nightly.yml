name: Nightly browser suites

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-browser-suites
  cancel-in-progress: false

permissions:
  contents: read

env:
  PLAYWRIGHT_VERSION: '1.63.0'

jobs:
  suites:
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 180
    env:
      SPLITPAGE_CHROME_ARGS: --no-sandbox --disable-dev-shm-usage
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install tooling
        run: npm ci

      - name: Build index.html and stamp sw.js
        run: node build.mjs --test

      - name: Select persistent Chromium cache
        run: |
          test -n "$RUNNER_TOOL_CACHE"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TOOL_CACHE/splitpage-playwright/$PLAYWRIGHT_VERSION" >> "$GITHUB_ENV"

      - name: Install Chromium
        run: |
          npx --yes playwright@${PLAYWRIGHT_VERSION} install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium
          exe=$(find "$PLAYWRIGHT_BROWSERS_PATH" -maxdepth 3 -type f -path '*/chromium-*/*' -name chrome -print -quit)
          if [ -z "$exe" ]; then
            echo "::error::no Chromium under $PLAYWRIGHT_BROWSERS_PATH"
            exit 1
          fi
          echo "SPLITPAGE_CHROME=$exe" >> "$GITHUB_ENV"

      - name: Pick this runner's port block
        run: |
          n=${RUNNER_NAME##*-}
          case "$n" in ''|*[!0-9]*|?????*) n=1 ;; esac
          echo "PORT_BASE=$(( (10#$n + 9) % 10 * 100 ))" >> "$GITHUB_ENV"

      - name: All browser suites
        run: node tools/run-suites.mjs "$RUNNER_TEMP/suites" --lanes 4 --port-base "$PORT_BASE"

      - name: Run the failing suites again one at a time
        if: failure()
        run: |
          summary="$RUNNER_TEMP/suites/summary.txt"
          test -f "$summary" || exit 0
          names=$(grep -v '^PASS ' "$summary" | awk '{ sub(/\.txt$/, "", $2); print $2 }' | paste -sd '|' -)
          test -n "$names" || exit 0
          node tools/run-suites.mjs "$RUNNER_TEMP/suites-alone" "^($names)\.txt\$" --lanes 1 --port-base "$PORT_BASE" || true

      - name: Keep the failing suites' output
        if: failure()
        run: |
          out="$RUNNER_TEMP/nightly-failures"
          mkdir -p "$out"
          summary="$RUNNER_TEMP/suites/summary.txt"
          test -f "$summary" || exit 0
          grep -v '^PASS' "$summary" > "$out/failures.txt" || true
          for run in suites suites-alone; do
            src="$RUNNER_TEMP/$run"
            test -f "$src/summary.txt" || continue
            mkdir -p "$out/$run/shots"
            cp "$src/summary.txt" "$out/$run/"
            awk '{ print $2 }' "$out/failures.txt" | while read -r suite; do
              test -f "$src/$suite.log" || continue
              cp "$src/$suite.log" "$out/$run/"
              sed -n 's/^shot //p' "$src/$suite.log" | while read -r png; do
                if [ -f "$png" ]; then cp "$png" "$out/$run/shots/"; fi
              done
            done
          done

      - name: Upload the failing suites' output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-failures
          path: ${{ runner.temp }}/nightly-failures
          if-no-files-found: ignore
          retention-days: 3
