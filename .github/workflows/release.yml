name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Read VERSION and check the tag
        id: version
        shell: bash
        run: |
          v="$(tr -d '\r\n' < VERSION)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($v) — tag the commit that bumped VERSION"
            exit 1
          fi

      - name: Install build dependencies
        run: npm ci

      - name: Portable zip
        run: node package.mjs

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Desktop installers (dist:win, with verify-dist)
        working-directory: desktop
        run: npm run dist:win

      - name: Collect the release files and their checksums
        shell: bash
        run: |
          v="${{ steps.version.outputs.version }}"
          mkdir release
          cp "dist/splitpage-$v.zip" \
             "desktop/dist/SplitpageDesktopSetup-$v-x64.exe" \
             "desktop/dist/SplitpageDesktopSetup-$v-arm64.exe" release/
          cd release
          sha256sum "splitpage-$v.zip" "SplitpageDesktopSetup-$v-x64.exe" "SplitpageDesktopSetup-$v-arm64.exe" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: splitpage-release-${{ steps.version.outputs.version }}
          path: release/
          if-no-files-found: error

  draft:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: splitpage-release-${{ needs.build.outputs.version }}
          path: release

      - name: Draft the release on splitpage-releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SPLITPAGE_RELEASES_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::No SPLITPAGE_RELEASES_TOKEN secret: the files are on this run as the splitpage-release-$VERSION artifact. Upload them to splitpage-releases by hand."
            exit 0
          fi
          pre=()
          case "$VERSION" in *-*) pre=(--prerelease) ;; esac
          gh release create "v$VERSION" \
            --repo RetroGorilla/splitpage-releases \
            --draft "${pre[@]}" \
            --title "Splitpage $VERSION" \
            --notes "Built from RetroGorilla/splitpage at ${GITHUB_SHA} by the Release workflow. What's new is in the app's Help (File ▸ User guide)." \
            release/*
          echo "Draft release v$VERSION created on RetroGorilla/splitpage-releases — review it and press Publish."
