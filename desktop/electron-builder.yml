appId: com.retrogorilla.splitpage
productName: Splitpage
copyright: Copyright 2024-2025 RetroGorilla

directories:
  output: dist
  buildResources: build

files:
  - main.js
  - preload.js
  - tabstrip-preload.js
  - drafts.js
  - ipc-channels.ts
  - ipc-setup.ts
  - ipc-files.ts
  - ipc-shell.ts
  - ipc-document.ts
  - ipc-history-blob.ts
  - ipc-tabstrip.ts
  - ipc-test-mode.ts
  - ipc-print.ts
  - print-pdf.js
  - prompter-share.js
  - close-quit.ts
  - session-restore.js
  - close-keep.ts
  - quit-watchdog.ts
  - blob-store.js
  - voice-composition.js
  - voice-helper.js
  - chromium-browsers.js
  - history-fs-backend.js
  - desktop-state.js
  - update-release.js
  - file-service.js
  - doc-claims.js
  - recents.js
  - window-appearance.ts
  - tab-registry.ts
  - restore-notice.ts
  - unsaved-dialog.ts
  - package.json

extraResources:
  - from: .stage/splitpage
    to: splitpage

asar: true

win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  artifactName: SplitpageDesktopSetup-${version}-${arch}.${ext}
  icon: build/icon.ico

nsis:
  differentialPackage: false
  useZip: true
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Splitpage
  menuCategory: Splitpage
  include: build/installer.nsh

fileAssociations:
  - ext: splitpage
    name: Splitpage script
    description: Splitpage script
    role: Editor

mac:
  target:
    - dmg
  category: public.app-category.productivity

linux:
  target:
    - AppImage

publish: null
