# Splitpage's document server, for a machine that HAS `docker compose`.
#
# Stock unRAID does not (it comes only with the Compose Manager plugin), so
# the server this repository is deployed to uses ./deploy.sh instead, which
# runs the same container with plain `docker build` + `docker run` and also
# snapshots the data folder, checks the settings and can roll back.
# DEPLOY.md is the runbook for both.
#
# From a checkout of the repository, with a filled-in .env beside this file
# (cp .env.example .env, then set JOIN_PIN — DEPLOY.md, First-time setup,
# step 3):
#
#   mkdir -p data && sudo chown 99:100 data
#   docker compose up -d --build
#
# No `node build.mjs` first: the Dockerfile builds the app inside the image.
#
# The server locks itself. JOIN_PIN in .env is the owner key, and the people
# you share a script with get an invite link for that one script — so do not
# run this without a JOIN_PIN, and never forward port 8791 on your router:
# reach it through a Cloudflare tunnel (DEPLOY.md, step 5).

services:
  splitpage:
    build: .
    image: splitpage:latest
    container_name: splitpage
    restart: unless-stopped

    # Every setting — the owner key, PERSIST_LINKS, TRUST_PROXY,
    # ALLOW_ORIGINS and the optional limits — lives in .env, explained line
    # by line in .env.example. Don't set PORT, HOST, DATA_DIR or STATIC_DIR
    # there: the image sets them to match the paths below.
    env_file: .env

    ports:
      # The tunnel connects outbound, so this port never needs forwarding.
      # The left number is what the tunnel points at; the right one is fixed.
      - "8791:8791"

    volumes:
      # Every script (one .json file each), every image (blobs/) and the
      # invite links (links/) live here. Back up the whole folder.
      - ./data:/data

    # unRAID's nobody:users, who owns the data folder. If the log says EACCES
    # on startup, the folder belongs to someone else: chown -R 99:100 data.
    user: "99:100"
