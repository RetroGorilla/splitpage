# Splitpage on Unraid.
#
# There is no authentication in this container ON PURPOSE — Cloudflare Access
# in front of your tunnel does that job, and does it better than anything I
# would write here. Do NOT port-forward 8791 to the internet directly.
#
#   node build.mjs && docker compose up -d --build
#
# The build.mjs is not optional in a repository checkout: index.html is
# generated and is not committed (#80), and `build: .` here uses the checkout
# as the image's build context. Deploying from CI's `splitpage-app` artifact
# instead skips it — the artifact is already built.
#
# NOTE: stock Unraid does not ship `docker compose` — it comes with the
# Compose Manager plugin. If you don't have it, DEPLOY.md §2 gives the
# equivalent plain `docker build` / `docker run` commands, which always work.
#
# See DEPLOY.md for the Cloudflare Tunnel + Access steps.

services:
  splitpage:
    build: .
    image: splitpage:latest
    container_name: splitpage
    restart: unless-stopped

    env_file: .env

    ports:
      # Bound to the LAN so the Cloudflare tunnel (and you) can reach it.
      # The tunnel connects outbound, so this port never needs forwarding.
      - "8791:8791"

    volumes:
      # Every document lives here as one .json file. Back it up by copying the
      # folder — there is no database and no index to rebuild.
      - ./data:/data

    # The share is usually owned by nobody:users (99:100) on Unraid. If the
    # container logs EACCES on startup, this is the line to change.
    user: "99:100"
